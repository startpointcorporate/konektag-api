{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tlsSecret is required" .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range $path := list "/api" "/docs" "/openapi.json" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-api
                port: {name: http}
          {{- end }}
{{- end }}
