{{- if and .Values.api.enabled .Values.siteApiIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-site-api
spec:
  ingressClassName: {{ .Values.siteApiIngress.className }}
  tls:
    - hosts: [{{ required "siteApiIngress.host is required" .Values.siteApiIngress.host | quote }}]
      secretName: {{ required "siteApiIngress.tlsSecret is required" .Values.siteApiIngress.tlsSecret }}
  rules:
    - host: {{ .Values.siteApiIngress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port: {name: http}
{{- end }}
