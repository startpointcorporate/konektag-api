{{- $root := . -}}
{{- range $name, $config := .Values.mcp }}
{{- $secret := required (printf "mcp.%s.existingSecret is required" $name) $config.existingSecret -}}
{{- $claim := required (printf "mcp.%s.oauthClaim must reference persistent OAuth storage" $name) $config.oauthClaim -}}
{{- $suffix := ternary "mcp" (printf "mcp-%s" $name) (eq $name "erpnext") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-mcp-{{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: "mcp-{{ $name }}"}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: "mcp-{{ $name }}"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ printf "%s-%s:%s" $root.Values.image.repository $suffix $root.Values.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          envFrom: [{secretRef: {name: {{ $secret }}}}]
          env:
            - {name: MCP_PORT, value: "8000"}
            - {name: MCP_HOST, value: "0.0.0.0"}
            - {name: UNIPILE_MCP_PORT, value: "8000"}
            - {name: UNIPILE_MCP_HOST, value: "0.0.0.0"}
            {{- range $key, $value := $config.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          ports: [{name: http, containerPort: 8000}]
          startupProbe: {tcpSocket: {port: http}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          readinessProbe:
            httpGet: {path: {{ printf "/.well-known/oauth-authorization-server%s" (ternary "" $config.pathPrefix (eq $config.pathPrefix "/")) | quote }}, port: http}
            periodSeconds: 10
          resources: {{ toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - {name: oauth, mountPath: /app/data}
            {{- with $config.extraVolumeMounts }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: oauth
          persistentVolumeClaim: {claimName: {{ $claim }}}
        {{- with $config.extraVolumes }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-mcp-{{ $name }}
spec:
  selector: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: "mcp-{{ $name }}"}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
