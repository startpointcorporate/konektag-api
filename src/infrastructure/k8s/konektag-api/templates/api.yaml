{{- $root := . -}}
{{- if or .Values.api.enabled .Values.workers.outbox .Values.workers.accounting }}
{{- $repository := required "image.repository is required" .Values.image.repository -}}
{{- $tag := required "image.tag must be the full Git SHA" .Values.image.tag -}}
{{- $secret := required "api.existingSecret must reference an existing Secret" .Values.api.existingSecret -}}
{{- range $role := list "api" "outbox" "accounting" }}
{{- if or (and (eq $role "api") $root.Values.api.enabled) (and (ne $role "api") (index $root.Values.workers $role)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $role }}
spec:
  replicas: {{ if eq $role "api" }}{{ $root.Values.api.replicas }}{{ else }}1{{ end }}
  revisionHistoryLimit: 5
  {{- if ne $role "api" }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $role }}}
    spec:
      automountServiceAccountToken: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.api.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: {{ $role }}
          image: {{ printf "%s-api:%s" $repository $tag | quote }}
          imagePullPolicy: IfNotPresent
          {{- if ne $role "api" }}
          command: ["node", "dist/{{ $role }}-worker.mjs"]
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          envFrom: [{secretRef: {name: {{ $secret }}}}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: APP_VERSION, value: {{ $tag | quote }}}
            {{- range $key, $value := $root.Values.api.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          {{- if eq $role "api" }}
          ports: [{name: http, containerPort: 3000}]
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /api/internal/health, port: http}, timeoutSeconds: 8, periodSeconds: 10}
          {{- else }}
          readinessProbe:
            exec:
              command: ["node", "dist/worker-readiness.mjs", {{ ternary "outbox-dispatcher" "accounting-worker" (eq $role "outbox") | quote }}]
            initialDelaySeconds: 15
            timeoutSeconds: 30
            periodSeconds: 60
          livenessProbe:
            exec: {command: ["node", "-e", "process.kill(1, 0)"]}
            periodSeconds: 30
          {{- end }}
          resources: {{ toYaml $root.Values.resources | nindent 12 }}
          {{- with $root.Values.api.volumeMounts }}
          volumeMounts: {{ toYaml . | nindent 12 }}
          {{- end }}
      {{- with $root.Values.api.volumes }}
      volumes: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
{{- end }}
