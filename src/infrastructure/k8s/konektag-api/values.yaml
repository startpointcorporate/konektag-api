# Values must point to the existing platform. No external software or Secrets are created.
image:
  repository: "" # Registry path without suffix: <repository>-api, -mcp, -mcp-m365, -mcp-unipile
  tag: "" # Full Git commit SHA
imagePullSecrets: []
api:
  enabled: true
  replicas: 1
  existingSecret: ""
  env: {} # API_PUBLIC_URL, PUBLIC_SITE_URL and existing non-secret configuration
  # Placement verified in the 2026-11-03 K3s inventory. Do not rename the node implicitly.
  nodeSelector: {kubernetes.io/hostname: konektag-clients}
  volumeMounts: [] # Existing CMS/GeoIP mounts if required by selected operations
  volumes: []
workers:
  outbox: false
  accounting: false
mcp:
  erpnext:
    nodeSelector: {kubernetes.io/hostname: konektag-clients}
    enabled: false
    pathPrefix: /
    existingSecret: ""
    oauthClaim: ""
    env: {}
  m365:
    nodeSelector: {kubernetes.io/hostname: konektag-clients}
    enabled: false
    pathPrefix: /m365
    existingSecret: ""
    oauthClaim: ""
    env: {}
    extraVolumes: [] # Existing M365 PFX Secret volume
    extraVolumeMounts: []
  unipile:
    nodeSelector: {kubernetes.io/hostname: konektag-clients}
    enabled: false
    pathPrefix: /unipile
    existingSecret: ""
    oauthClaim: ""
    env: {}
ingress:
  enabled: false
  className: traefik
  clusterIssuer: letsencrypt-http01 # Existing cert-manager ClusterIssuer
  host: ""
  tlsSecret: "" # Existing TLS Secret
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}

# Opt-in API routing on the existing website. Keep the frontend catch-all unchanged.
# No rewrite/strip middleware: /api paths and request/response data pass unchanged.
siteApiIngress:
  enabled: false
  className: traefik
  host: www.konektag.eu
  tlsSecret: "" # Existing TLS Secret, supplied only when explicitly enabled

# Scheduled controls already exist on the platform: disable here until their ownership is transferred.
# Retention is destructive by its existing business policy and is never enabled automatically.
jobs:
  daily-reconciliation: {enabled: false, schedule: "0 2 * * *"}
  inject-sanctions-batch: {enabled: false, schedule: "0 6 * * *"}
  re-screen-users: {enabled: false, schedule: "0 3 * * 0"}
  purge-expired-data: {enabled: false, schedule: "0 4 * * *"}
  wallet-integrity-worker: {enabled: false, schedule: "*/5 * * * *"}
  reconcile-pawapay-deposits: {enabled: false, schedule: ""} # Configure existing cadence before enabling.

mcpIngress:
  enabled: false
  className: traefik
  host: ""
  tlsSecret: ""
