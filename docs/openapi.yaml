                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        count:
                          type: integer
                          minimum: 0
                        cities:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              count:
                                type: integer
                                minimum: 0
                            required:
                              - id
                              - name
                              - count
                      required:
                        - code
                        - count
                        - cities
                  activities:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                        count:
                          type: integer
                          minimum: 0
                      required:
                        - code
                        - name
                        - count
                required:
                  - countries
                  - activities
