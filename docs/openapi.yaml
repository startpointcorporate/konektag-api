  /api/public/marketplace/merchants:
    get:
      operationId: get__api_public_marketplace_merchants
      summary: GET /api/public/marketplace/merchants
      tags:
        - public
      description: SELECT-only reader of marketplace_published_establishments, Published rows only. All filters combine with
        AND before pagination. Name uses case/accent-insensitive Unicode normalization, with slug as stable tie-breaker.
        Distance is Haversine (km), ascending, missing coordinates last ordered by name then slug. q searches name,
        descriptions, activities and products/services if exposed by the projection. No typo tolerance. Empty pages
        retain the filtered total. No bbox required; map uses the current page.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: country
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            description: Valid ISO 3166-1 alpha-2 country code.
        - name: city
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
            description: Opaque city id from facets; never a city name.
        - name: activity
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - distance
            default: name
        - name: lat
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
            description: Required with lng when sort=distance.
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
            description: Required with lat when sort=distance.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Globally filtered and sorted published establishments; sort echoed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        name:
                          type: string
                        seoDescription:
                          type: string
                        city:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                          required: []
                        countryCode:
                          type: string
                        activities:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                              name:
                                type: string
                            required:
                              - code
                              - name
                        coordinates:
                          type: object
                          properties:
                            lat:
                              type: number
                            lng:
                              type: number
                          required:
                            - lat
                            - lng
                        logo:
                          type: object
                          properties:
                            url:
                              type: string
                              format: uri
                          required:
                            - url
                        distanceKm:
                          type:
                            - number
                            - "null"
                          description: Only returned for sort=distance; null when coordinates are absent.
                      required:
                        - slug
                        - name
                        - activities
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 50
                  sort:
                    type: string
                    enum:
                      - name
                      - distance
                required:
                  - items
                  - total
                  - page
                  - limit
                  - sort
        "422":
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: INVALID_PARAMETERS
                required:
                  - error
        "503":
          description: Projection unavailable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: PROJECTION_UNAVAILABLE
                required:
                  - error
      security: []
      x-source: src/api/routes/public/marketplace/merchants/index.ts
      x-error-codes:
        - INVALID_PARAMETERS
        - PROJECTION_UNAVAILABLE
      x-response-schema-scope: Explicit public projection contract.
