name: Deploy Konektag API to K3s PVC

on:
  workflow_run:
    workflows: ["REST test coverage"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with approved K3s SSH access
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: konektag-api-production-pvc
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish committed API version to K3s
    # Only a successful push-to-main CI may deploy automatically. PR CI is excluded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.K3S_DEPLOY_ENVIRONMENT }}
    timeout-minutes: 20
    steps:
      - name: Checkout exactly the CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify CI commit is still main HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.K3S_DEPLOY_ENVIRONMENT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ENVIRONMENT" || { echo "Set repository variable K3S_DEPLOY_ENVIRONMENT to the existing protected environment name" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "Checkout SHA differs from CI SHA" >&2; exit 1; }
          MAIN_SHA="$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)"
          test -n "$MAIN_SHA" && test "$MAIN_SHA" = "$EXPECTED_SHA" || {
            echo "Commit superseded on main; refusing stale deployment" >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate deploy script syntax
        run: bash -n deploy-api.sh scripts/api-build-pod.sh

      - name: Require deployment approval and SSH configuration
        shell: bash
        env:
          ENABLED: ${{ vars.K3S_DEPLOY_ENABLED }}
          SSH_HOST: ${{ secrets.SSH_CORE_HOST }}
          SSH_PORT: ${{ secrets.SSH_CORE_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_CORE_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_CORE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$ENABLED" = "true" || { echo "Enable K3S_DEPLOY_ENABLED in the protected environment" >&2; exit 1; }
          test -n "$SSH_HOST" &&
            test -n "$SSH_PORT" && test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" || {
              echo "Missing SSH_CORE_HOST/PORT/PRIVATE_KEY/KNOWN_HOSTS" >&2
              exit 1
            }

      - name: Configure secure SSH alias for deployment
        id: ssh
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_CORE_HOST }}
          SSH_PORT: ${{ secrets.SSH_CORE_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_CORE_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_CORE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/konektag_ci"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<SSHCONFIG
          Host konektag-core
            HostName $SSH_HOST
            User ci-deploy
            Port $SSH_PORT
            IdentityFile ~/.ssh/konektag_ci
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 15
          SSHCONFIG
          HOST_LOOKUP="$SSH_HOST"
          if [ "$SSH_PORT" != "22" ]; then HOST_LOOKUP="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "The pinned known_hosts does not contain the configured host" >&2
            exit 1
          }

      - name: Confirm authorized K3s access
        shell: bash
        run: |
          set -euo pipefail
          ssh konektag-core "sudo -n k3s kubectl -n konektag-api get deployment konektag-api -o name"
          ssh konektag-core "sudo -n k3s kubectl -n konektag-api get pvc konektag-api-code -o name"

      - name: Deploy with existing volume and in-pod Linux x64 build
        env:
          KONEKTAG_K3S_HOST: konektag-core
        run: bash deploy-api.sh

      # Retry cleanup even when the deployment shell was interrupted by the runner.
      # The helper validates the technical pod and can never delete its PVC.
      - name: Clean up API build pod
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        run: bash scripts/api-build-pod.sh cleanup
