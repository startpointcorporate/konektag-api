name: Deploy Konektag API to K3s PVC

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with approved K3s SSH access
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: konektag-api-production-pvc
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish committed API version to K3s
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deploy script syntax
        run: bash -n deploy-api.sh

      - name: Require deployment approval and SSH configuration
        shell: bash
        env:
          ENABLED: ${{ vars.K3S_DEPLOY_ENABLED }}
          SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          SSH_USER: ${{ secrets.K3S_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.K3S_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$ENABLED" = "true" || { echo "Enable K3S_DEPLOY_ENABLED in the protected environment" >&2; exit 1; }
          test -n "$SSH_HOST" && test -n "$SSH_USER" &&
            test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS" || {
              echo "Missing K3S_SSH_HOST/USER/PRIVATE_KEY/KNOWN_HOSTS" >&2
              exit 1
            }

      - name: Configure secure SSH alias for deployment
        shell: bash
        env:
          SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          SSH_USER: ${{ secrets.K3S_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.K3S_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/konektag_ci"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<SSHCONFIG
          Host konektag-core
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/konektag_ci
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 15
          SSHCONFIG
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "The pinned known_hosts does not contain the configured host" >&2
            exit 1
          }

      - name: Confirm authorized K3s access
        shell: bash
        run: |
          set -euo pipefail
          ssh konektag-core "sudo -n k3s kubectl -n konektag-api get deployment konektag-api -o name"
          ssh konektag-core "sudo -n k3s kubectl -n konektag-api get pod konektag-api-setup -o name"

      - name: Deploy with existing volume and in-pod Linux x64 build
        env:
          KONEKTAG_K3S_HOST: konektag-core
        run: bash deploy-api.sh
