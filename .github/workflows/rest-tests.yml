name: REST test coverage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  points-k-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: konektag_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d konektag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/konektag_test
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/run-migrations.mjs
      - name: Verify Points K money, concurrency and settlement on disposable PostgreSQL
        run: npx vitest run --config tests/integration/vitest.config.ts tests/integration/points-k-money.pg.ts tests/integration/points-k-direct-deposit.pg.ts tests/integration/internal-k-send.pg.ts tests/integration/link-pay-network.pg.ts
  rest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test API deployment pod lifecycle
        run: |
          bash -n deploy-api.sh scripts/api-build-pod.sh
          node --test tests/deployment/api-build-pod.mjs
      - run: npm run docs:generate
      - run: npm run typecheck
      - run: git diff --exit-code -- src/api/registry.ts docs/routes.json docs/openapi.yaml
      - name: Execute tests and reject coverage regressions
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE_REF" && test "$BASE_REF" != 0000000000000000000000000000000000000000; then
            npm run test:rest:coverage -- --check --baseline-ref "$BASE_REF"
          else
            npm run test:rest:coverage -- --check
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-test-results
          path: |
            work/rest-results.json
            docs/rest-test-coverage.json
            docs/rest-test-coverage.md
